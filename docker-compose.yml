services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: cpfcnpjapi
      DB_PASSWORD: cpfcnpjapi123
      DB_NAME: cpfcnpjdb
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cpfcnpjapi
      POSTGRES_PASSWORD: cpfcnpjapi123
      POSTGRES_DB: cpfcnpjdb
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: